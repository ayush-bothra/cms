# Usage: docker compose -f docker-compose.yml -f docker-compose.constrained.yml up
#
# Constrains the Strapi container to Render's free-tier web service spec
# (512 MB RAM, 0.1 vCPU) so the "local" run isolates software-level bottlenecks
# from network/virtualization effects, holding hardware constant against Render.
#
# NOTE: Render's free Postgres instance has its own (separate) resource limits —
# check Render's current Postgres free-tier spec and mirror it below on the
# `postgres` service too if you want full hardware parity, not just the web service.
services:
  strapi:
    mem_limit: 512m
    memswap_limit: 512m # prevents swap from masking the memory ceiling
    cpus: 0.1
  redis:
    mem_limit: 25m
    memswap_limit: 25m
    command: redis-server --maxmemory 20mb --maxmemory-policy allkeys-lru
  k6:
    image: grafana/k6
    networks:
      - default
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    volumes:
      - ./scripts/script.js:/scripts/script.js:ro
      - ./document_ids.json:/scripts/document_ids.json:ro
      - ./results:/results
    entrypoint: ["sh", "-c"]
    command:
      - "k6 run -o experimental-prometheus-rw /scripts/script.js"
    profiles: ["tools"]
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["tools"]
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    profiles: ["tools"]

volumes:
  prometheus-data:
  grafana-data:
